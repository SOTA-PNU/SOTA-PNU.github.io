<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Gallery — SOTA Lab @ Pusan National University</title>
    <meta name="description"
        content="SOTA Lab의 학회 출장, 랩 워크숍, 수상, 세미나 기록을 연도순으로 모았습니다." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Gallery — SOTA Lab @ Pusan National University" />
    <meta property="og:description" content="학회 출장 · 랩 워크숍 · 수상 · 세미나 — 연도순 기록." />
    <meta property="og:url" content="https://sota.pusan.ac.kr/gallery.html" />
    <meta property="og:site_name" content="SOTA Lab" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sota.pusan.ac.kr/teamX.png" />
    <meta property="og:image:alt" content="SOTA Lab" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gallery — SOTA Lab @ Pusan National University" />
    <meta name="twitter:description" content="학회 출장 · 랩 워크숍 · 수상 · 세미나 — 연도순 기록." />
    <meta name="twitter:image" content="https://sota.pusan.ac.kr/teamX.png" />
    <meta name="twitter:image:alt" content="SOTA Lab" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/redesign.css" />
</head>

<body class="min-h-screen flex flex-col bg-white"
    style="font-family:&quot;Pretendard&quot;, -apple-system, BlinkMacSystemFont, system-ui, Roboto, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif">
    <div id="siteHeader"></div>
    <div class="flex-1 pt-16 md:pt-20 lg:pt-24">
        <main class="bg-white">
            <section class="max-w-[1400px] mx-auto px-6 lg:px-10 py-12 lg:py-16 pnu-gallery">
                <!-- Header -->
                <div class="flex flex-col gap-4 lg:gap-6 mb-10">
                    <h1 class="text-3xl lg:text-4xl font-extrabold tracking-tight text-slate-900">Gallery</h1>

                    <!-- 연도가 2개 이상일 때만 js/gallery.js 가 채우고 hidden 을 푼다 -->
                    <nav class="pnu-gallery-jump" id="galleryJump" aria-label="Jump to year" hidden>
                        <span class="pnu-gallery-jump-label">Jump to</span>
                    </nav>
                </div>

                <!-- 앨범 목록: data/gallery.json 을 js/gallery.js 가 렌더링합니다.
                     사진 추가 방법은 assets/images/gallery/README.md 참고.
                     이 HTML 을 직접 편집하지 마세요. -->
                <div class="space-y-12" id="galleryList" aria-busy="true">
                    <p class="text-slate-500">갤러리를 불러오는 중…</p>
                </div>
                <noscript><p class="text-slate-600">갤러리를 보려면 JavaScript 를 켜 주세요.</p></noscript>
            </section>
        </main>
    </div>
    <div id="siteFooter"></div>

    <!-- 앨범 상세 창 (js/gallery.js 가 내용을 채운다) -->
    <div class="pnu-gallery-lightbox" id="galleryLightbox" hidden>
        <div class="pnu-gallery-lb-panel" role="dialog" aria-modal="true" aria-labelledby="galleryLbTitle">
            <div class="pnu-gallery-lb-bar">
                <div class="pnu-gallery-lb-head">
                    <div class="pnu-gallery-lb-title" id="galleryLbTitle"></div>
                    <div class="pnu-gallery-lb-sub" id="galleryLbSub"></div>
                </div>
                <button class="pnu-gallery-lb-close" id="galleryLbClose" type="button" aria-label="닫기 (Esc)">✕</button>
            </div>

            <div class="pnu-gallery-lb-stage">
                <button class="pnu-gallery-lb-nav pnu-gallery-lb-prev" id="galleryLbPrev" type="button"
                    aria-label="이전 사진">‹</button>
                <img id="galleryLbImg" src="" alt="" decoding="async">
                <button class="pnu-gallery-lb-nav pnu-gallery-lb-next" id="galleryLbNext" type="button"
                    aria-label="다음 사진">›</button>
                <span class="pnu-gallery-lb-count" id="galleryLbCount" role="status" aria-live="polite"></span>
            </div>

            <div class="pnu-gallery-lb-info">
                <p class="pnu-gallery-lb-caption" id="galleryLbCaption" hidden></p>
                <p class="pnu-gallery-lb-desc" id="galleryLbDesc"></p>
                <div class="pnu-gallery-lb-rail" id="galleryLbRail" role="group" aria-label="사진 목록"></div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
