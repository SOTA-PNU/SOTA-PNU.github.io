<!DOCTYPE html><!--0b1M6vRScNvCpEh3GfV9e-->
<html lang="ko">

<head>
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>SOTA Lab — System Optimization for Transformative AI @ Pusan National University</title>
    <meta name="description"
        content="SOTA Lab at Pusan National University researches compiler, architecture, and runtime systems to optimize AI end-to-end." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SOTA Lab @ Pusan National University" />
    <meta property="og:description"
        content="Compiler · Architecture · Runtime Systems for end-to-end AI optimization." />
    <meta property="og:url" content="https://sota.pusan.ac.kr" />
    <meta property="og:site_name" content="SOTA Lab" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sota.pusan.ac.kr/team.png" />
    <meta property="og:image:alt" content="SOTA Lab" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SOTA Lab @ Pusan National University" />
    <meta name="twitter:description"
        content="Compiler · Architecture · Runtime Systems for end-to-end AI optimization." />
    <meta name="twitter:image" content="https://sota.pusan.ac.kr/team.png" />
    <meta name="twitter:image:alt" content="SOTA Lab" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/redesign.css" />
</head>

<body class="min-h-screen flex flex-col bg-white"
    style="font-family:&quot;Pretendard&quot;, -apple-system, BlinkMacSystemFont, system-ui, Roboto, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif">
    <div hidden=""><!--$--><!--/$--></div>
    <div id="siteHeader"></div>
    <div class="flex-1 pt-16 md:pt-20 lg:pt-24">
        <main class="bg-white">
            <section class="max-w-[1400px] mx-auto px-6 lg:px-10 py-12 lg:py-16">
                <!-- Header -->
                <div class="flex flex-col gap-4 lg:gap-6 mb-10">
                    <div class="flex flex-wrap items-end justify-between gap-4">
                        <div>
                            <h1 class="text-3xl lg:text-4xl font-extrabold tracking-tight text-slate-900">Publications</h1>
                        </div>

                        <!-- Quick filters (js/publications.js initFilters)
                             - All: 모든 조건 해제 ('전체 보기' 버튼이라 토글 상태가 없다)
                             - 국제/국내 묶음과 유형 묶음은 각각 하나만 켜지고, 두 묶음은 함께 걸린다(AND).
                               켜진 칩을 다시 누르면 그 조건만 해제된다.
                             - 국제/국내는 갱신 스크립트가 시트에서 판정: 'SCI/학회' 가 국내…/KCI… 이거나 학회명에 한글이 있으면 국내.
                             묶음마다 감싸 두어 좁은 화면에서도 묶음 단위로 줄이 바뀐다. -->
                        <div class="pnu-pub-filters" id="pubFilters" role="group" aria-label="논문 필터">
                            <button class="pnu-chip is-active" type="button" data-filter="all">All</button>
                            <div class="pnu-chip-group" role="group" aria-label="국제/국내">
                                <button class="pnu-chip" type="button" data-region="international" aria-pressed="false">International</button>
                                <button class="pnu-chip" type="button" data-region="domestic" aria-pressed="false">Domestic</button>
                            </div>
                            <div class="pnu-chip-group" role="group" aria-label="유형">
                                <button class="pnu-chip" type="button" data-filter="conference" aria-pressed="false">Conference</button>
                                <button class="pnu-chip" type="button" data-filter="journal" aria-pressed="false">Journal</button>
                                <!--<button class="pnu-chip" type="button" data-filter="workshop" aria-pressed="false">Workshop</button>-->
                                <button class="pnu-chip" type="button" data-filter="awarded" aria-pressed="false">Awarded</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 논문 목록: data/publications.json 을 js/publications.js 가 렌더링합니다.
                     데이터는 Google 시트('논문 등록') → 메뉴 "🌐 홈페이지 ▸ 논문 목록 갱신" 으로 갱신 (apps-script/README.md).
                     이 HTML 을 직접 편집하지 마세요. -->
                <div class="space-y-12" id="pubList" aria-live="polite">
                    <p class="text-slate-500">논문 목록을 불러오는 중…</p>
                </div>
                <!-- 필터 결과 알림: 결과가 0건이면 보이고, 그 밖에는 스크린리더에만 "논문 N편" 을 읽어 준다.
                     role=status 영역은 늘 있어야 바뀐 내용이 읽히므로 hidden 으로 숨기지 않는다. -->
                <p class="pnu-sr-only text-slate-500" id="pubStatus" role="status"></p>
                <noscript><p class="text-slate-600">논문 목록을 보려면 JavaScript 를 켜 주세요.</p></noscript>
            </section>
        </main><!--$--><!--/$-->
    </div>
    <div id="siteFooter"></div>
    <script src="js/main.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/publications.js"></script>
</body>

</html>
